# Демонстраційні значення (не для реального використання).
# PGHOST: DNS-ім'я Service тестового PostgreSQL у namespace demo.
apiVersion: v1
kind: Secret
metadata:
  name: users-db-connection
  namespace: demo
type: Opaque
stringData:
  PGHOST: postgres.demo.svc.cluster.local
  PGPORT: "5432"
  PGDATABASE: usersdb
  PGUSER: postgres
  PGPASSWORD: demo-password
